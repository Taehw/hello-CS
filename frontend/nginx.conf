server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;  # Nginx 웹 루트 디렉토리
    index login.html;  # 기본 페이지

    # 접근 로그 상세 설정
    access_log /var/log/nginx/access.log combined;  # 접근 로그 파일
    error_log /var/log/nginx/error.log;  # 에러 로그 파일

    location / {
        try_files $uri $uri/ /login.html;  # 파일 존재 여부 확인
    }

    # CORS 헤더 추가 (필요시)
    add_header X-Content-Type-Options "nosniff" always;  # X-Content-Type-Options 헤더 추가
    add_header X-Frame-Options "SAMEORIGIN" always;
}

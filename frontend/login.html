<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Docker 네트워크 분석</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .hint-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .hint-box strong {
            color: #667eea;
        }

        .network-log {
            margin-top: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .network-log h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .log-entry {
            font-size: 12px;
            color: #555;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 로그인</h1>
        <p class="subtitle">Docker 네트워크 분석 프로젝트</p>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">사용자명</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit">로그인</button>
        </form>

        <div class="hint-box">
            <strong>💡 테스트 계정:</strong><br>
            사용자명: <code>admin</code><br>
            비밀번호: <code>password</code>
        </div>

        <div class="network-log">
            <h3>📊 네트워크 로그</h3>
            <div id="networkLog">
                <div class="log-entry">대기 중...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        
        // 네트워크 로그 추가 함수
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('networkLog');
            const timestamp = new Date().toISOString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.color = type === 'error' ? '#c33' : type === 'success' ? '#3c3' : '#555';
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // 알림 표시 함수
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }

        // 로그인 폼 제출
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            addLog(`🔄 HTTP POST 요청 시작: ${API_URL}/api/login`);
            addLog(`🔌 TCP 3-Way Handshake 시작 (SYN -> SYN-ACK -> ACK)`);
            
            try {
                const startTime = performance.now();
                
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include', // 쿠키 전송 허용
                    body: JSON.stringify({ username, password })
                });
                
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);
                
                addLog(`📦 HTTP 응답 수신 (${response.status} ${response.statusText}) - ${duration}ms`);
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    addLog(`✅ 로그인 성공! 쿠키 설정됨`, 'success');
                    addLog(`🍪 Set-Cookie 헤더로 sessionId 수신`);
                    showAlert('로그인 성공! 메인 페이지로 이동합니다.', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'main.html';
                    }, 1500);
                } else {
                    addLog(`❌ 로그인 실패: ${data.message}`, 'error');
                    showAlert(data.message || '로그인에 실패했습니다.', 'error');
                }
                
                addLog(`🔌 TCP 4-Way Handshake 시작 (FIN -> ACK -> FIN -> ACK)`);
                
            } catch (error) {
                addLog(`💥 네트워크 오류: ${error.message}`, 'error');
                showAlert('서버에 연결할 수 없습니다. 백엔드가 실행 중인지 확인하세요.', 'error');
                console.error('Error:', error);
            }
        });

        // 페이지 로드 시
        window.addEventListener('load', () => {
            addLog('🌐 프론트엔드 페이지 로드 완료');
            addLog(`📍 현재 URL: ${window.location.href}`);
        });
    </script>
</body>
</html>
